[package]
name = "ttd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
ttd_sys = { path = "../ttd_sys", default-features = false }
bitflags = "2.10.0"
chrono = "0.4.42"
derive_more = { version = "2.0.1", features = ["from", "debug", "display"] }
log = { version = "0.4.28", features = ["std"] }

[features]
default = ["replay"]
full = ["replay", "record"]

replay = ["ttd_sys/replay"]
record = []

[lints.rust]
unsafe_code = "allow"
unused = { level = "allow", priority = -1 } # TODO (calladoum) for dev
