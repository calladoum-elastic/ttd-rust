name: Build

on:
  push:
    # branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          # - windows-2022 # missing `winget`
          - windows-2025
          # - windows-11-arm # not available for private repos
        build: [debug, release]

    name: ${{ matrix.os }}/${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - run: |
          rustup update
          rustup component add rustfmt
          rustup show

      - name: Build (debug)
        if: matrix.build == 'debug'
        run: |
          cargo fmt --check
          cargo build --all-targets
          cargo clippy

      - name: Build (release)
        if: matrix.build == 'release'
        run: |
          cargo fmt --check
          cargo build --all-targets --release
          cargo clippy --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ttd_${{ matrix.build }}_${{ matrix.os }}_${{ github.sha }}
          if-no-files-found: warn
          path: |
            ./TTD*.dll
            ./target/**/ttd.dll
            ./target/**/ttd.pdb
            ./target/**/windbg_ext_rs.dll
            ./target/**/windbg_ext_rs.pdb
            ./target/**/auto_unpack.exe
            ./target/**/auto_unpack.pdb
