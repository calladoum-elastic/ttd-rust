name: Build

on:
  push:
    # branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          # - windows-2022 # missing `winget`
          - windows-2025
          # - windows-11-arm # not available for private repos
        build: [debug, release]

    name: ${{ matrix.os }}/${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: rust-lang/rustup@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        env:
          cache-name: cache-deps
        with:
          key: cargo-${{ matrix.os }}-${{ matrix.build }}-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          restore-keys:
            cargo-${{ matrix.os }}-${{ matrix.build }}-

      - name: Build (debug)
        if: matrix.build == 'debug'
        run: |
          cargo fmt --check
          cargo build --all-targets
          cargo clippy

      - name: Build (release)
        if: matrix.build == 'release'
        run: |
          cargo fmt --check
          cargo build --all-targets --release
          cargo clippy --release

      - name: Run C++ Tests
        run: |
          ttd -acceptEula -out $env:TEMP\test -launch c:\windows\system32\cmd.exe "/c whoami"
          ./ttd/ttd_ffi/install/ttd_ffi_tests/Tests/ttd_ffi_tests.exe

      - name: Run Rust Tests (debug)
        if: matrix.build == 'debug'
        run: |
          cp .\ttd*.dll .\target\debug\deps\
          cargo test

      - name: Run Rust Tests (release)
        if: matrix.build == 'release'
        run: |
          cp .\ttd*.dll .\target\release\deps\
          cargo test --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ttd_${{ matrix.build }}_${{ matrix.os }}_${{ github.sha }}
          if-no-files-found: warn
          path: |
            ./ttd/ttd_ffi_tests/tests
            ./ttd/ttd_ffi/install
            ./TTD*.dll
            ./target/**/ttd.rlib
            ./target/**/ttd.dll
            ./target/**/ttd.pdb
            ./target/**/auto_unpack.exe
            ./target/**/auto_unpack.pdb
